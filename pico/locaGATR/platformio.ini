; locaGATR board firmware: control board V1, Raspberry Pi Pico.
; pio run            build
; pio run -t upload  flash over the Pico's USB (hold BOOTSEL on first flash)

[platformio]
name = locaGATR
description = Control board sensor relay: tracking wheel counts answered to the Brain over RS-485
default_envs = control_board_v1

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#a1df30f
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_src_flags = -Wall -Wextra

[env:control_board_v1]

; Same board, Pico 2 (RP2350) fitted: pio run -e control_board_v1_pico2
[env:control_board_v1_pico2]
board = rpipico2
